<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Publish — ORIZEEN Times</title>
  <link rel="icon" type="image/jpeg" href="https://i.ibb.co/rGmrygt3/Picsart-26-05-26-11-05-56-835.jpg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0A0A;
      --bg2: #111;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #fff;
      --text2: rgba(255,255,255,0.6);
      --text3: rgba(255,255,255,0.35);
      --green: #1DB954;
      --gold: #C9A84C;
      --red: #C0392B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* === LOGO === */
    .logo-wrap {
      margin-bottom: 2rem;
      text-align: center;
    }
    .logo-wrap img {
      height: 60px;
      width: auto;
      object-fit: contain;
    }

    /* === LOGIN === */
    #loginScreen {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
    }
    .login-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
      text-align: center;
      color: var(--text);
    }
    .login-sub {
      font-size: 0.8rem;
      color: var(--text3);
      text-align: center;
      margin-bottom: 1.5rem;
      letter-spacing: 0.04em;
    }

    /* === PUBLISH PANEL === */
    #publishPanel {
      width: 100%;
      max-width: 560px;
      display: none;
      flex-direction: column;
      gap: 1.5rem;
    }

    .panel-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--text);
      text-align: center;
    }
    .panel-sub {
      font-size: 0.78rem;
      color: var(--text3);
      text-align: center;
      margin-top: 0.25rem;
      letter-spacing: 0.04em;
    }

    /* === FORM === */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .form-group label {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text3);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    input, select, textarea {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      width: 100%;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: rgba(29,185,84,0.5);
    }
    select option { background: #111; color: #fff; }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
    }
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--green);
      cursor: pointer;
    }
    .checkbox-group label {
      font-size: 0.85rem;
      color: var(--text2);
      cursor: pointer;
      text-transform: none;
      letter-spacing: 0;
    }

    /* === BUTTONS === */
    .btn {
      width: 100%;
      padding: 0.9rem;
      border-radius: 10px;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-green { background: var(--green); color: #000; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
    }
    .btn-red { background: var(--red); color: #fff; }

    /* === PROGRESS LOG === */
    #progressCard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      display: none;
      flex-direction: column;
      gap: 0.75rem;
    }
    .progress-title {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 0.25rem;
    }
    .log-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      font-size: 0.85rem;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }
    .log-icon { font-size: 1rem; flex-shrink: 0; margin-top: 0.1rem; }
    .log-text { color: var(--text2); }
    .log-text.success { color: var(--green); }
    .log-text.error { color: var(--red); }
    .log-text.info { color: var(--gold); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* === RESULT CARD === */
    #resultCard {
      background: rgba(29,185,84,0.06);
      border: 1px solid rgba(29,185,84,0.3);
      border-radius: 16px;
      padding: 1.5rem;
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      text-align: center;
    }
    .result-icon { font-size: 2.5rem; }
    .result-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--green);
    }
    .result-article-title {
      font-size: 0.95rem;
      color: var(--text2);
      line-height: 1.5;
    }
    .result-links {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }
    .result-link {
      font-size: 0.78rem;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(29,185,84,0.4);
      color: var(--green);
      text-decoration: none;
      transition: background 0.2s;
    }
    .result-link:hover { background: rgba(29,185,84,0.1); }

    /* === ERROR CARD === */
    #errorCard {
      background: rgba(192,57,43,0.06);
      border: 1px solid rgba(192,57,43,0.3);
      border-radius: 16px;
      padding: 1.5rem;
      display: none;
      flex-direction: column;
      gap: 0.5rem;
      text-align: center;
    }
    .error-title { font-size: 1rem; color: var(--red); font-weight: 600; }
    .error-msg { font-size: 0.82rem; color: var(--text2); }

    /* === FOOTER === */
    .publish-footer {
      margin-top: 2rem;
      font-size: 0.7rem;
      color: var(--text3);
      text-align: center;
      letter-spacing: 0.06em;
    }
    .publish-footer a { color: var(--green); text-decoration: none; }

    @media (max-width: 480px) {
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- LOGO -->
  <div class="logo-wrap">
    <a href="index.html">
      <img src="https://i.ibb.co/9HJgqzfp/Picsart-26-05-26-08-14-42-179.png" alt="ORIZEEN Times"/>
    </a>
  </div>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <h2 class="login-title">Publisher Access</h2>
    <p class="login-sub">ORIZEEN Times — Automated Publishing</p>
    <div class="form-group" style="margin-bottom:1rem">
      <label>Password</label>
      <input type="password" id="publishPass" placeholder="Enter publish password"/>
    </div>
    <button class="btn btn-green" onclick="checkPublishLogin()">Enter</button>
    <p id="loginError" style="color:var(--red);font-size:0.8rem;margin-top:0.75rem;text-align:center"></p>
  </div>

  <!-- PUBLISH PANEL -->
  <div id="publishPanel">

    <div>
      <h1 class="panel-title">⚡ Auto Publisher</h1>
      <p class="panel-sub">Paste a news URL → AI rewrites, publishes & posts to socials</p>
    </div>

    <!-- FORM -->
    <div class="form-card" id="formCard">

      <div class="form-group">
        <label>📰 News Article URL *</label>
        <input type="url" id="sourceUrl" placeholder="https://bbc.com/news/..."/>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>📂 Category *</label>
          <select id="category">
            <option value="BREAKING">BREAKING</option>
            <option value="WORLD">WORLD</option>
            <option value="POLITICS">POLITICS</option>
            <option value="TECH">TECH</option>
            <option value="BUSINESS">BUSINESS</option>
            <option value="SPORTS">SPORTS</option>
            <option value="CULTURE">CULTURE</option>
            <option value="SCIENCE">SCIENCE</option>
            <option value="OPINION">OPINION</option>
            <option value="ORIZEENALS">ORIZEENALS</option>
          </select>
        </div>
        <div class="form-group" id="parentCatGroup" style="display:none">
          <label>↩️ Parent Category</label>
          <select id="parentCategory">
            <option value="WORLD">WORLD</option>
            <option value="POLITICS">POLITICS</option>
            <option value="TECH">TECH</option>
            <option value="BUSINESS">BUSINESS</option>
            <option value="SPORTS">SPORTS</option>
            <option value="CULTURE">CULTURE</option>
            <option value="SCIENCE">SCIENCE</option>
            <option value="OPINION">OPINION</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>🖼 Custom Image URL (optional — uses article image if empty)</label>
        <input type="url" id="imageUrl" placeholder="https://i.ibb.co/..."/>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="isFeatured"/>
        <label for="isFeatured">★ Mark as Featured Article</label>
      </div>

      <button class="btn btn-green" id="publishBtn" onclick="startPublish()">
        ⚡ Generate &amp; Publish
      </button>

      <button class="btn btn-ghost" onclick="doLogout()">Logout</button>

    </div>

    <!-- PROGRESS LOG -->
    <div id="progressCard">
      <p class="progress-title">⚙️ Publishing in progress...</p>
      <div id="logItems"></div>
    </div>

    <!-- RESULT -->
    <div id="resultCard">
      <div class="result-icon">✅</div>
      <div class="result-title">Published Successfully!</div>
      <div class="result-article-title" id="resultTitle"></div>
      <div class="result-links" id="resultLinks"></div>
      <button class="btn btn-green" style="margin-top:0.5rem" onclick="resetPublish()">
        Publish Another
      </button>
    </div>

    <!-- ERROR -->
    <div id="errorCard">
      <div class="result-icon">❌</div>
      <div class="error-title">Publishing Failed</div>
      <div class="error-msg" id="errorMsg"></div>
      <button class="btn btn-ghost" style="margin-top:0.75rem" onclick="resetPublish()">
        Try Again
      </button>
    </div>

  </div>

  <p class="publish-footer">
    <a href="admin.html">← Admin Panel</a> &nbsp;·&nbsp;
    <a href="index.html">View Website</a>
  </p>

<script src="config.js"></script>
<script>
  const API_URL = "https://orizeen-api.getorizeen.workers.dev";
  const SITE_URL = "https://theorizeentimes.getorizeen.workers.dev";
  let publishPassword = '';

  // === LOGIN ===
  document.getElementById('publishPass').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkPublishLogin();
  });

  function checkPublishLogin() {
    const pass = document.getElementById('publishPass').value;
    if (!pass) return;
    publishPassword = pass;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('publishPanel').style.display = 'flex';
  }

  function doLogout() {
    publishPassword = '';
    document.getElementById('publishPanel').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'block';
    document.getElementById('publishPass').value = '';
    document.getElementById('loginError').textContent = '';
  }

  // === CATEGORY TOGGLE ===
  document.getElementById('category').addEventListener('change', function() {
    const parentGroup = document.getElementById('parentCatGroup');
    parentGroup.style.display = this.value === 'BREAKING' ? 'block' : 'none';
  });

  // === LOGGING ===
  function addLog(icon, text, type = '') {
    const logItems = document.getElementById('logItems');
    const item = document.createElement('div');
    item.className = 'log-item';
    item.innerHTML = `
      <span class="log-icon">${icon}</span>
      <span class="log-text ${type}">${text}</span>
    `;
    logItems.appendChild(item);
    item.scrollIntoView({ behavior: 'smooth' });
  }

  function updateLastLog(icon, text, type = '') {
    const logItems = document.getElementById('logItems');
    const last = logItems.lastElementChild;
    if (last) {
      last.querySelector('.log-icon').textContent = icon;
      last.querySelector('.log-text').textContent = text;
      last.querySelector('.log-text').className = `log-text ${type}`;
    }
  }

  // === MAIN PUBLISH FUNCTION ===
  async function startPublish() {
    const sourceUrl = document.getElementById('sourceUrl').value.trim();
    const category = document.getElementById('category').value;
    const parentCategory = document.getElementById('parentCategory').value;
    const imageUrl = document.getElementById('imageUrl').value.trim();
    const isFeatured = document.getElementById('isFeatured').checked;

    if (!sourceUrl) {
      alert('Please paste a news article URL.');
      return;
    }

    // Show progress
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('progressCard').style.display = 'flex';
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('errorCard').style.display = 'none';
    document.getElementById('logItems').innerHTML = '';

    try {
      // ── Step 1: Rewrite Article ──
      addLog('⏳', 'Fetching and rewriting article with AI...');
      const rewriteRes = await fetch(`${API_URL}/api/rewrite`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ source_url: sourceUrl, category })
      });
      const rewriteData = await rewriteRes.json();
      if (!rewriteData.success) throw new Error('Rewrite failed: ' + rewriteData.error);
      updateLastLog('✅', `Article rewritten: "${rewriteData.article.title}"`, 'success');

      const article = rewriteData.article;

      // ── Step 2: Generate Photocard ──
      addLog('⏳', 'Generating branded photocard...');
      let finalImage = imageUrl || rewriteData.og_image || '';
      try {
        const canvas = await generatePhotocard(article, category, finalImage);
        addLog('⏳', 'Uploading photocard to imgBB...');
        const uploadedUrl = await uploadToImgBB(canvas);
        if (uploadedUrl) {
          finalImage = uploadedUrl;
          updateLastLog('✅', 'Photocard generated and uploaded', 'success');
        } else {
          updateLastLog('⚠️', 'imgBB upload failed — using original image', 'info');
        }
      } catch(e) {
        updateLastLog('⚠️', 'Photocard generation failed — using original image', 'info');
      }

      // ── Step 3: Publish to Supabase ──
      addLog('⏳', 'Publishing article to website...');

      // Unfeature others if featured
      if (isFeatured) {
        await fetch(`${SUPABASE_URL}/rest/v1/articles?featured=eq.true`, {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ featured: false })
        });
      }

      const breaking_until = category === 'BREAKING'
        ? new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString()
        : null;

      const supabaseRes = await fetch(`${SUPABASE_URL}/rest/v1/articles`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({
          title: article.title,
          excerpt: article.excerpt,
          content: article.content,
          location: article.location,
          author: article.author,
          category: category,
          parent_category: category === 'BREAKING' ? parentCategory : null,
          breaking_until,
          featured: isFeatured,
          image_url: finalImage,
          source_url: sourceUrl,
          source_name: (() => { try { return new URL(sourceUrl).hostname.replace('www.',''); } catch(e) { return ''; } })(),
          published: true
        })
      });

      const supabaseData = await supabaseRes.json();
      if (!supabaseRes.ok) throw new Error('Supabase failed: ' + JSON.stringify(supabaseData));
      const articleId = supabaseData[0]?.id;
      updateLastLog('✅', `Published to website — Article #${articleId}`, 'success');

      // ── Step 4: Shorten URL ──
      addLog('⏳', 'Shortening URL with Bitly...');
      const longUrl = `${SITE_URL}/article?id=${articleId}`;
      let shortUrl = longUrl;
      try {
        const bitlyRes = await fetch(`${API_URL}/api/shorten`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: longUrl })
        });
        const bitlyData = await bitlyRes.json();
        if (bitlyData.short) shortUrl = bitlyData.short;
        updateLastLog('✅', `URL shortened: ${shortUrl}`, 'success');
      } catch(e) {
        updateLastLog('⚠️', 'Bitly failed — using full URL', 'info');
      }

      // ── Step 5: Generate AI Caption ──
      addLog('⏳', 'Generating social media caption with AI...');
      let caption = `${article.title}\n\n${article.excerpt}\n\n🔗 ${shortUrl}`;
      try {
        const captionRes = await fetch(`${API_URL}/api/caption`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: article.title,
            excerpt: article.excerpt,
            category,
            short_url: shortUrl
          })
        });
        const captionData = await captionRes.json();
        if (captionData.caption) {
          caption = captionData.caption;
          updateLastLog('✅', 'AI caption generated', 'success');
        } else {
          updateLastLog('⚠️', 'AI caption failed — using default', 'info');
        }
      } catch(e) {
        updateLastLog('⚠️', 'AI caption failed — using default', 'info');
      }

      // ── Step 6: Post to Buffer ──
      addLog('⏳', 'Posting to X, Facebook and Threads...');
      const CHANNEL_IDS = [
        "6a126998c687a22dd41dd5db",
        "6a1268c9c687a22dd41dd48a",
        "6a1268aac687a22dd41dd441",
      ];
      try {
        const bufferRes = await fetch(`${API_URL}/api/post`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ caption, channelIds: CHANNEL_IDS })
        });
        const bufferData = await bufferRes.json();
        if (bufferData.success) {
          updateLastLog('✅', 'Posted to X, Facebook and Threads', 'success');
        } else {
          updateLastLog('⚠️', 'Buffer posting failed — check manually', 'info');
        }
      } catch(e) {
        updateLastLog('⚠️', 'Buffer posting failed — check manually', 'info');
      }

      // ── Done ──
      addLog('🎉', 'All done!', 'success');

      // Show result
      setTimeout(() => {
        document.getElementById('progressCard').style.display = 'none';
        document.getElementById('resultCard').style.display = 'flex';
        document.getElementById('resultTitle').textContent = article.title;
        document.getElementById('resultLinks').innerHTML = `
          <a href="${longUrl}" target="_blank" class="result-link">View Article</a>
          <a href="${shortUrl}" target="_blank" class="result-link">Short URL</a>
          <a href="https://publish.buffer.com" target="_blank" class="result-link">Check Buffer</a>
        `;
      }, 800);

    } catch(e) {
      document.getElementById('progressCard').style.display = 'none';
      document.getElementById('errorCard').style.display = 'flex';
      document.getElementById('errorMsg').textContent = e.message;
    }
  }

  // === PHOTOCARD GENERATOR ===
  const CATEGORY_COLORS = {
    BREAKING:  { bg: '#C0392B', text: '#fff', glow: '#C0392B', border: '#C0392B' },
    POLITICS:  { bg: '#145A32', text: '#fff', glow: '#C9A84C', border: '#C9A84C' },
    WORLD:     { bg: '#1C2833', text: '#fff', glow: '#1DB954', border: '#1DB954' },
    TECH:      { bg: '#0E6655', text: '#1DB954', glow: '#1DB954', border: '#1DB954' },
    BUSINESS:  { bg: '#C9A84C', text: '#000', glow: '#C9A84C', border: '#C9A84C' },
    SPORTS:    { bg: '#1DB954', text: '#000', glow: '#1DB954', border: '#1DB954' },
    CULTURE:   { bg: '#1A1A2E', text: '#C9A84C', glow: '#C9A84C', border: '#C9A84C' },
    SCIENCE:   { bg: '#117A65', text: '#fff', glow: '#1ABC9C', border: '#1ABC9C' },
    OPINION:   { bg: 'rgba(0,0,0,0.6)', text: '#fff', glow: '#C0392B', border: '#C0392B' },
    ORIZEENALS:{ bg: '#0A0A0A', text: '#C9A84C', glow: '#C9A84C', border: '#C9A84C' },
  };

  const LOGO_URL = "https://i.ibb.co/9HJgqzfp/Picsart-26-05-26-08-14-42-179.png";
  const DEFAULT_BG_URL = "https://i.ibb.co/rGmrygt3/Picsart-26-05-26-11-05-56-835.jpg";
  const IMGBB_API_KEY_PC = typeof IMGBB_KEY !== 'undefined' ? IMGBB_KEY : '';

  function loadImage(src) {
    return new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = () => {
        const fallback = new Image();
        fallback.crossOrigin = 'anonymous';
        fallback.onload = () => resolve(fallback);
        fallback.onerror = () => resolve(null);
        fallback.src = DEFAULT_BG_URL + '?t=' + Date.now();
      };
      img.src = src + (src.includes('?') ? '&' : '?') + 'crossorigin=1';
    });
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    let lineCount = 0;
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      if (ctx.measureText(testLine).width > maxWidth && n > 0) {
        ctx.fillText(line.trim(), x, y + lineCount * lineHeight);
        line = words[n] + ' ';
        lineCount++;
        if (lineCount >= 3) break;
      } else {
        line = testLine;
      }
    }
    if (lineCount < 3) ctx.fillText(line.trim(), x, y + lineCount * lineHeight);
    return lineCount + 1;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  async function generatePhotocard(article, category, imageUrl) {
    const SIZE = 1080;
    const canvas = document.createElement('canvas');
    canvas.width = SIZE;
    canvas.height = SIZE;
    const ctx = canvas.getContext('2d');
    const catStyle = CATEGORY_COLORS[category] || CATEGORY_COLORS.WORLD;
    const accent = catStyle.border;

    // Background
    const bgSrc = imageUrl || DEFAULT_BG_URL;
    const bgImg = await loadImage(bgSrc);
    if (bgImg) {
      ctx.drawImage(bgImg, 0, 0, SIZE, SIZE);
    }
    // Dark overlay
    ctx.fillStyle = 'rgba(10,10,10,0.75)';
    ctx.fillRect(0, 0, SIZE, SIZE);

    // Main sharp image (top 52%)
    const imgH = SIZE * 0.52;
    if (bgImg) {
      ctx.save();
      roundRect(ctx, 32, 72, SIZE - 64, imgH, 18);
      ctx.clip();
      ctx.drawImage(bgImg, 32, 72, SIZE - 64, imgH);
      ctx.restore();
      // glow border
      ctx.save();
      ctx.strokeStyle = accent;
      ctx.lineWidth = 3;
      ctx.shadowColor = accent;
      ctx.shadowBlur = 20;
      roundRect(ctx, 32, 72, SIZE - 64, imgH, 18);
      ctx.stroke();
      ctx.restore();
    }

    // Logo pill (top left)
    ctx.save();
    ctx.fillStyle = 'rgba(10,10,10,0.88)';
    ctx.shadowColor = 'rgba(201,168,76,0.3)';
    ctx.shadowBlur = 10;
    roundRect(ctx, 30, 16, 218, 48, 24);
    ctx.fill();
    ctx.strokeStyle = 'rgba(201,168,76,0.35)';
    ctx.lineWidth = 1;
    roundRect(ctx, 30, 16, 218, 48, 24);
    ctx.stroke();
    ctx.restore();

    const logoImg = await loadImage(LOGO_URL);
    if (logoImg) {
      ctx.drawImage(logoImg, 40, 20, 198, 40);
    } else {
      ctx.fillStyle = '#C9A84C';
      ctx.font = 'bold 24px Arial';
      ctx.fillText('ORIZEEN Times', 48, 48);
    }

    // Date pill (top right)
    const dateStr = new Date().toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
    const locStr = article.location || '';
    ctx.save();
    ctx.fillStyle = 'rgba(10,10,10,0.85)';
    roundRect(ctx, SIZE - 230, 16, 198, 48, 24);
    ctx.fill();
    ctx.strokeStyle = `${accent}55`;
    ctx.lineWidth = 1;
    roundRect(ctx, SIZE - 230, 16, 198, 48, 24);
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = '500 14px Arial';
    ctx.textAlign = 'center';
    if (locStr) {
      ctx.fillText(locStr.slice(0, 22), SIZE - 131, 33);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '300 13px Arial';
      ctx.fillText(dateStr, SIZE - 131, 52);
    } else {
      ctx.fillText(dateStr, SIZE - 131, 46);
    }
    ctx.textAlign = 'left';

    // Category badge
    ctx.font = 'bold 15px Arial';
    const catW = ctx.measureText(category).width + 36;
    const catY = imgH + 56;
    ctx.save();
    ctx.fillStyle = catStyle.bg;
    ctx.shadowColor = catStyle.glow;
    ctx.shadowBlur = 14;
    roundRect(ctx, 32, catY - 20, catW, 32, 16);
    ctx.fill();
    ctx.strokeStyle = catStyle.border;
    ctx.lineWidth = 1.5;
    roundRect(ctx, 32, catY - 20, catW, 32, 16);
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = catStyle.text;
    ctx.font = 'bold 14px Arial';
    ctx.fillText(category, 32 + 18, catY + 2);

    // Bottom glass panel
    const panelY = imgH + 98;
    ctx.fillStyle = 'rgba(8,8,8,0.92)';
    ctx.fillRect(0, panelY, SIZE, SIZE - panelY);
    ctx.fillStyle = accent;
    ctx.fillRect(0, panelY, 5, SIZE - panelY);
    ctx.strokeStyle = `${accent}44`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, panelY);
    ctx.lineTo(SIZE, panelY);
    ctx.stroke();

    // Headline
    const hlY = panelY + 60;
    const words = article.title.split(' ');
    const firstWord = words[0].toUpperCase();
    const restTitle = words.slice(1).join(' ');

    ctx.font = 'bold 58px Georgia, serif';
    ctx.fillStyle = accent;
    ctx.fillText(firstWord, 36, hlY);
    const fw = ctx.measureText(firstWord + ' ').width;

    ctx.font = 'italic 46px Georgia, serif';
    ctx.fillStyle = '#ffffff';
    const hlLines = wrapText(ctx, restTitle, 36 + fw, hlY, SIZE - 80 - fw, 54);

    // Excerpt
    const exY = hlY + Math.max(hlLines, 1) * 54 + 18;
    ctx.font = '300 21px Arial';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    const excerpt = (article.excerpt || '').slice(0, 110) + '...';
    wrapText(ctx, excerpt, 36, exY, SIZE - 72, 30);

    // Read more line
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(36, SIZE - 80);
    ctx.lineTo(SIZE - 36, SIZE - 80);
    ctx.stroke();

    ctx.font = '300 17px Arial';
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText('READ MORE  ↓', 36, SIZE - 56);

    // Footer
    ctx.font = '300 15px Arial';
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillText('© ORIZEEN Times', 36, SIZE - 22);
    ctx.textAlign = 'right';
    try {
      ctx.fillText(new URL(document.getElementById('sourceUrl').value).hostname.replace('www.',''), SIZE - 36, SIZE - 22);
    } catch(e) {}
    ctx.textAlign = 'left';

    return canvas;
  }

  async function uploadToImgBB(canvas) {
    return new Promise((resolve) => {
      canvas.toBlob(async (blob) => {
        try {
          const key = typeof IMGBB_KEY !== 'undefined' ? IMGBB_KEY : IMGBB_API_KEY_PC;
          if (!key) { resolve(null); return; }
          const formData = new FormData();
          formData.append('image', blob, 'photocard.png');
          const res = await fetch(`https://api.imgbb.com/1/upload?key=${key}`, {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          resolve(data.success ? data.data.url : null);
        } catch(e) { resolve(null); }
      }, 'image/png', 0.95);
    });
  }


  function resetPublish() {
    document.getElementById('formCard').style.display = 'flex';
    document.getElementById('progressCard').style.display = 'none';
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('errorCard').style.display = 'none';
    document.getElementById('logItems').innerHTML = '';
    document.getElementById('sourceUrl').value = '';
    document.getElementById('imageUrl').value = '';
    document.getElementById('isFeatured').checked = false;
    document.getElementById('category').value = 'BREAKING';
    document.getElementById('parentCatGroup').style.display = 'none';
  }
</script>
